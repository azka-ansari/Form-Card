<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation & Modal</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="container">

        <h2>Registration Form</h2>

        <form id="myForm">

            <label for="name">FullName</label>
            <input type="text" id="name" placeholder="FullName">

            <p id="nameError" class="error"></p>

            <label for="cnic">CNIC</label>
            <input type="text" id="cnic" placeholder="41234-1234567-1">

            <p id="cnicError" class="error"></p>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="example@gmail.com">

            <p id="emailError" class="error"></p>

            <button type="submit">Submit</button>

        </form>

        <button id="openModal">Open Card</button>

    </div>


   <div class="modal" id="myModal">

    <div class="modal-content">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQb1iNc9eS5SI2WwutQ1LZCdVqkVFOGR4Kbv2O8V4gVhQ&s=10" alt="Student">

        <h2>Welcome!</h2>

        <p id="userName"></p>

        <p id="userCnic"></p>

        <p id="userEmail"></p>

        <button class="close" id="closeModal">
            Close
        </button>

    </div>

</div>
    <script src="jdncds.js"></script>


</body>

</html>
